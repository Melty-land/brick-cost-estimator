<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>砖成本材料预算 · 成本估算系统</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%231f2d3d'/%3E%3Ctext x='8' y='11.8' font-size='10' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E砖%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="app-title">
      <h1>浙江陆创新材料科技有限公司 · 砖成本材料预算系统</h1>
      <div class="app-sub">本地 Web 版 —— 数据存储于 SQLite(data/brick.db),支持快照/导出备份</div>
    </div>
    <nav id="tabs" class="tabs">
      <button class="tab active" data-view="materials">材料管理</button>
      <button class="tab" data-view="products">产品配方</button>
      <button class="tab" data-view="estimates">估算单</button>
      <button class="tab" data-view="charts">图表预览</button>
      <button class="tab" data-view="compare">历史对比</button>
      <button class="tab" data-view="users" id="tab-users" hidden>用户管理</button>
      <span class="user-area" id="user-area" hidden>
        <span id="user-badge"></span>
        <button id="btn-logout">退出</button>
      </span>
    </nav>
    <div class="sysbar">
      <span>数据备份:</span>
      <button data-action="db-snapshot">快照备份</button>
      <button data-action="db-export">导出备份文件</button>
      <button data-action="db-import">导入恢复</button>
      <input id="import-file" type="file" accept=".zip,.json" hidden>
      <span class="sysbar-hint">快照存于 data/backups/;导出为 zip 单文件,可拷走/上传网盘;导入会先自动快照再覆盖。</span>
    </div>
  </header>

  <!-- 登录 / 注册 覆盖层 -->
  <div id="auth-screen">
    <div class="auth-card">
      <h2>砖成本材料预算 · 成本估算系统</h2>
      <p class="auth-sub" id="auth-sub">请登录后使用(默认账号 admin / admin123,登录后请尽快修改密码)</p>
      <form id="auth-form">
        <label>用户名
          <input id="auth-username" type="text" autocomplete="username" required>
        </label>
        <label>密码
          <input id="auth-password" type="password" autocomplete="current-password" required>
        </label>
        <label id="auth-nickname-wrap" hidden>昵称(可选)
          <input id="auth-nickname" type="text" autocomplete="nickname">
        </label>
        <p id="auth-msg" class="auth-msg"></p>
        <button type="submit" class="primary auth-submit" id="auth-submit">登 录</button>
      </form>
      <p class="auth-switch" id="auth-switch">没有账号?<a href="#" id="auth-toggle">注册一个</a></p>
      <p class="auth-note">首个注册账号自动成为管理员;其余注册为普通用户。</p>
    </div>
  </div>

  <main>
    <section id="view-materials" class="view"></section>
    <section id="view-products" class="view" hidden></section>
    <section id="view-estimates" class="view" hidden></section>
    <section id="view-charts" class="view" hidden></section>
    <section id="view-compare" class="view" hidden></section>
    <section id="view-users" class="view" hidden></section>
    <section id="view-editor" class="view" hidden></section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <div id="boot-error" class="boot-error" hidden></div>

  <!-- 退出编辑器三选弹窗 -->
  <div id="exit-modal" class="modal-mask" hidden>
    <div class="modal-box">
      <h3>退出前请选择保存方式</h3>
      <p id="exit-missing" class="modal-note"></p>
      <div class="modal-actions">
        <button data-exit-choice="draft">存为草稿</button>
        <button data-exit-choice="discard">不保存(放弃修改)</button>
        <button class="primary" data-exit-choice="ready">保存为可用表格</button>
        <button data-exit-choice="cancel">取消(留在编辑)</button>
      </div>
    </div>
  </div>

  <!-- 通用确认弹窗(相邻批次衔接提醒等) -->
  <div id="confirm-modal" class="modal-mask" hidden>
    <div class="modal-box">
      <h3 id="confirm-title">确认</h3>
      <p id="confirm-msg" class="modal-note" style="white-space:pre-line"></p>
      <div class="modal-actions">
        <button id="confirm-cancel">取消</button>
        <button class="primary" id="confirm-ok">仍要保存</button>
      </div>
    </div>
  </div>

  <script src="js/calc.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/formula.js"></script>
  <script src="js/sheet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
